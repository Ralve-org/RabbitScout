version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # @types/node must track the Node major we actually build and ship on
      # (see the Docker base image below). Bumped by hand alongside it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # The base image tracks the Node.js *LTS* line, which Dependabot can't
      # infer — odd-numbered Node releases (25, 27, …) are Current-only and
      # reach EOL fast, so an automatic major bump is a downgrade in support.
      # Bump this by hand when the next even release reaches Active LTS:
      # Node 26 → Active LTS on 2026-10-27 (Node 24 security support ends 2028-04-30).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
